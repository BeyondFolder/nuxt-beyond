faqs:
  title: Frequently Asked Questions
  description: Everything you need to know about NuxtBeyond.
  items:
    - label: What's included in the boilerplate?
      content: 'Full-stack Nuxt 4 app with: AI chat using Vercel AI SDK v6 and Cloudflare AutoRAG, image generation (DALL-E 3), video generation (Sora), authentication (Google OAuth + credentials), Stripe subscriptions, embeddable widget, multi-tenancy, Nuxt UI v4, dark mode, and zero-config Cloudflare deployment.'
      icon: i-lucide-package
    - label: What AI features are included?
      content: 'RAG (Retrieval-Augmented Generation) with Cloudflare AI Search for semantic document search, streaming AI responses via Vercel AI SDK v6, tool calling, image generation with DALL-E 3, video generation with OpenAI Sora, custom system prompts, and prompt injection protection.'
      icon: i-lucide-sparkles
    - label: What tech stack does it use?
      content: 'Nuxt 4, Vue 3, TypeScript, Nuxt UI v4, Tailwind CSS, Drizzle ORM, Cloudflare D1/R2/KV, Vercel AI SDK v6, OpenAI (via Cloudflare AI Gateway), Stripe, Resend, and nuxt-auth-utils.'
      icon: i-lucide-layers
    - label: Can I use this for commercial projects?
      content: 'Yes! Your license allows unlimited commercial projects. Build and sell as many AI-powered products as you want.'
      icon: i-lucide-briefcase
    - label: How does deployment work?
      content: 'Zero-config deployment to Cloudflare via NuxtHub. One command deploys your entire stack—database (D1), file storage (R2), KV store, and Workers. Edge-native performance worldwide.'
      icon: i-lucide-rocket
    - label: What support is included?
      content: 'Discord community access for questions and discussions. The boilerplate includes comprehensive documentation in CLAUDE.md, designed for AI coding assistants to understand and help you customize.'
      icon: i-lucide-headphones
    - label: Is there a refund policy?
      content: 'Due to the digital nature of the product and immediate source code access, all sales are final. We encourage you to review the demo and documentation before purchasing.'
      icon: i-lucide-receipt
    - label: How do I receive updates?
      content: 'Lifetime updates are included. You''ll receive access to the GitHub repository where all updates are pushed. Major updates are announced in the Discord community.'
      icon: i-lucide-refresh-cw
