faqs:
  title: Frequently Asked Questions
  description: ''
  items:
    - label: What's included in the boilerplate?
      content: 'Full-stack Nuxt 4 app with: AI chat using Vercel AI SDK v6 and Cloudflare AutoRAG, authentication (Google OAuth + credentials), Stripe or Polar subscriptions, embeddable widget, Nuxt UI v4, dark mode, and Cloudflare deployment.'
      icon: i-lucide-package
    - label: What tech stack does it use?
      content: 'Nuxt 4, Vue 3, TypeScript, Nuxt UI v4, Tailwind CSS, Drizzle ORM, Cloudflare D1/R2/KV, Vercel AI SDK, Stripe or Polar, and nuxt-auth-utils.'
      icon: i-lucide-layers
    - label: Is NuxtBeyond open source?
      content: 'Yes. NuxtBeyond is open source under the MIT License. You can fork it, modify it, and use it for personal or commercial projects. See the [GitHub repository](https://github.com/BeyondFolder/nuxt-beyond).'
      icon: i-lucide-briefcase
    - label: How is the AI integration set up?
      content: 'Uses Vercel AI SDK v6 for streaming responses, Cloudflare AutoRAG for RAG/knowledge base search, and OpenAI models routed through Cloudflare AI Gateway. Supports tool calling and human handoff.'
      icon: i-lucide-brain
    - label: Does it include authentication?
      content: 'Yes! Full authentication with Google OAuth, email/password, email verification, password reset, and session management using nuxt-auth-utils.'
      icon: i-lucide-lock
    - label: How does deployment work?
      content: 'Zero-config deployment to Cloudflare via NuxtHub. One command deploys your entire stack including database, storage, and KV.'
      icon: i-lucide-rocket
    - label: How do I get help or contribute?
      content: 'Open an issue or a pull request on [GitHub](https://github.com/BeyondFolder/nuxt-beyond). Bug reports, fixes, and improvements are welcome.'
      icon: i-lucide-headphones
cta:
  title: Stop rebuilding the same features. [Ship your AI product today.]{.text-primary}
  description: Authentication, payments, AI chat, RAG, embeddable widgets - all pre-built. Focus on what makes your product unique.
