faqs:
  title: Frequently Asked Questions
  description: ''
  items:
    - label: What's included in the boilerplate?
      content: 'Full-stack Nuxt 4 app with: AI chat using Vercel AI SDK v6 and Cloudflare AutoRAG, authentication (Google OAuth + credentials), Stripe subscriptions, embeddable widget, Nuxt UI v4, dark mode, and Cloudflare deployment.'
      icon: i-lucide-package
    - label: What tech stack does it use?
      content: 'Nuxt 4, Vue 3, TypeScript, Nuxt UI v4, Tailwind CSS, Drizzle ORM, Cloudflare D1/R2/KV, Vercel AI SDK, Stripe, and nuxt-auth-utils.'
      icon: i-lucide-layers
    - label: Can I use this for commercial projects?
      content: 'Yes! The boilerplate includes a license that allows unlimited commercial projects. Build and sell as many products as you want.'
      icon: i-lucide-briefcase
    - label: How is the AI integration set up?
      content: 'Uses Vercel AI SDK v6 for streaming responses, Cloudflare AutoRAG for RAG/knowledge base search, and Workers AI for model inference. Supports tool calling and human handoff.'
      icon: i-lucide-brain
    - label: Does it include authentication?
      content: 'Yes! Full authentication with Google OAuth, email/password, email verification, password reset, and session management using nuxt-auth-utils.'
      icon: i-lucide-lock
    - label: How does deployment work?
      content: 'Zero-config deployment to Cloudflare via NuxtHub. One command deploys your entire stack including database, storage, and KV.'
      icon: i-lucide-rocket
    - label: What support is included?
      content: 'Pro includes Discord community access and priority email support. Enterprise includes dedicated support and custom integrations.'
      icon: i-lucide-headphones
