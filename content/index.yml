faqs:
  title: Frequently Asked Questions
  description: Everything you need to know about NuxtBeyond.
  items:
    - label: What's included in the boilerplate?
      content: 'Full-stack Nuxt 4 app with: AI chat using Vercel AI SDK v6 and Cloudflare AutoRAG, image generation (OpenAI GPT Image), video generation (Google Gemini Omni Flash), authentication (Google OAuth + credentials), subscriptions with Stripe or Polar, embeddable widget, multi-tenancy, Nuxt UI v4, dark mode, and zero-config Cloudflare deployment.'
      icon: i-lucide-package
    - label: What AI features are included?
      content: 'RAG (Retrieval-Augmented Generation) with Cloudflare AI Search for semantic document search, streaming AI responses via Vercel AI SDK v6, tool calling, image generation with OpenAI GPT Image, video generation with Google Gemini Omni Flash, custom system prompts, and prompt injection protection.'
      icon: i-lucide-sparkles
    - label: What tech stack does it use?
      content: 'Nuxt 4, Vue 3, TypeScript, Nuxt UI v4, Tailwind CSS, Drizzle ORM, Cloudflare D1/R2/KV, Vercel AI SDK v6, OpenAI (via Cloudflare AI Gateway), Stripe or Polar, Resend, and nuxt-auth-utils.'
      icon: i-lucide-layers
    - label: Can I use this for commercial projects?
      content: 'Yes. NuxtBeyond is released under the MIT License, so you can use it for personal and commercial projects, including client work and products you sell. Keep the copyright and license notice in your copy of the code.'
      icon: i-lucide-briefcase
    - label: How does deployment work?
      content: 'It deploys to Cloudflare Workers. Run `npm run deploy` (Wrangler) from your machine, or connect the repo to Cloudflare Workers Builds to deploy on every push. The database (D1), file storage (R2), and KV store are Cloudflare bindings set in `wrangler.jsonc`.'
      icon: i-lucide-rocket
    - label: Is NuxtBeyond really free?
      content: 'Yes. The full source code is free on [GitHub](https://github.com/BeyondFolder/nuxt-beyond) under the MIT License. Running your app can still cost money: the services you connect, like Cloudflare, OpenAI, Google Gemini (for video), Stripe or Polar, and Resend, bill you under their own pricing.'
      icon: i-lucide-scale
    - label: How do I receive updates?
      content: 'Updates are pushed to the public [GitHub repository](https://github.com/BeyondFolder/nuxt-beyond). Star or watch the repo to follow changes, then pull the ones you want into your copy.'
      icon: i-lucide-refresh-cw
