seo:
  title: NuxtBeyond - The AI-First Nuxt 4 Boilerplate
  description: Ship AI-powered SaaS products in days, not months. Open-source, full-stack Nuxt 4 boilerplate with AI chat, RAG, authentication, Stripe or Polar billing, and Cloudflare deployment.
title: Ship AI-powered apps [in days]{.text-primary}, not months
description: The complete Nuxt 4 boilerplate for building AI-first SaaS products. Authentication, payments, AI chat with RAG, embeddable widgets, and Cloudflare deployment - all pre-configured.
hero:
  links:
    - label: Get Started
