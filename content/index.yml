steps:
  title: From Clone to [Production]{.text-primary} in Minutes
  description: Three steps. That's it. No complex setup, no configuration hell.
  items:
    - step: '01'
      title: Clone & Configure
      description: Clone the repo, copy .env.example, add your API keys.
      code: |
        git clone git@github.com:BeyondFolder/nuxt-beyond.git
        cp .env.example .env
        npm install
    - step: '02'
      title: Customize
      description: Adjust branding, configure plans, modify AI prompts for your use case.
      code: |
        # Edit shared/constants.ts for plans
        # Edit content/index.yml for landing page
        # Add your Stripe or Polar products
    - step: '03'
      title: Deploy
      description: Set up your project in Cloudflare Workers dashboard, then build and deploy.
      code: |
        npm run build && npm run deploy
        # That's it. You're live.
