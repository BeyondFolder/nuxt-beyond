aiFeatures:
  title: '[AI-First]{.text-primary} by Design'
  description: Not just another CRUD boilerplate with AI slapped on. Built from the ground up for AI-powered applications.
  categories:
    - title: Streaming AI Chat
      description: Real-time responses with Vercel AI SDK v6
      icon: i-lucide-message-square
      color: info
      features:
        - OpenAI GPT via Cloudflare AI Gateway
        - Server-sent events streaming
        - Tool calling and function execution
        - Custom system prompts per project
        - Chat history persistence
    - title: Image Generation
      description: Text-to-image with DALL-E 3 integration
      icon: i-lucide-image-plus
      color: warning
      features:
        - Generate images from text prompts
        - Multiple size and quality options
        - Integrated into chat interface
        - R2 storage for generated images
    - title: Video Generation
      description: Text-to-video with OpenAI Sora
      icon: i-lucide-film
      color: error
      features:
        - Generate videos from descriptions
        - Image-to-video conversion
        - Multiple resolution options
        - Async generation with status tracking
    - title: RAG & Knowledge Base
      description: Semantic search over documents with Cloudflare AI Search
      icon: i-lucide-database
      color: primary
      features:
        - Upload PDF, Word, CSV, and text files
        - Automatic document indexing with AutoRAG
        - Semantic similarity search
        - Website content import via Cloudflare Browser
        - Plan-based storage limits
    - title: Embeddable Widget
      description: Add AI chat to any website with one line of code
      icon: i-lucide-code-2
      color: success
      features:
        - Customizable colors and positioning
        - Domain validation for security
        - Custom logo support
        - Initial suggested questions
        - Human support escalation
    - title: Security & Protection
      description: Built-in safeguards against misuse
      icon: i-lucide-shield
      color: neutral
      features:
        - Prompt injection protection
        - AI response sanitization
        - Rate limiting per IP
        - Cloudflare Turnstile CAPTCHA
        - Domain allowlisting
fullStackFeatures:
  title: '[Full-Stack]{.text-primary} Features Included'
  description: Everything you need beyond AI. Authentication, payments, multi-tenancy—production-ready. All running on Cloudflare's edge network.
  features:
    - title: Authentication
      description: Google OAuth, email/password, verification, password reset, and session management with nuxt-auth-utils.
      icon: i-lucide-fingerprint
    - title: Stripe & Polar Billing
      description: Switch between Stripe and Polar (merchant of record) with one env var. Subscriptions, checkout, customer portal, webhooks, and plan-based feature gating.
      icon: i-lucide-credit-card
    - title: Multi-Tenancy
      description: Project-based isolation, team invitations, role-based access control (admin/member), and member management.
      icon: i-lucide-building-2
    - title: Email System
      description: Transactional emails via Resend—verification, password reset, invitations, support notifications.
      icon: i-lucide-send
    - title: Blog & Content
      description: Nuxt Content integration with markdown support, SEO optimization, and landing page YAML configuration.
      icon: i-lucide-file-text
    - title: Cloudflare Edge Stack
      description: D1 database, R2 storage, KV caching, Workers runtime — all pre-configured. One-command deploy via NuxtHub, with support for Vercel, Netlify, and other providers.
      icon: i-simple-icons-cloudflare
