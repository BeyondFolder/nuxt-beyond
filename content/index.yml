      color: primary
      to: /signup
      icon: i-lucide-arrow-right
    - label: View Demo
      variant: outline
      color: neutral
      to: /dashboard
      icon: i-lucide-play
  headline: Save 200+ hours of setup
liveDemo:
  title: See the [demo]{.text-primary}
  description: Experience the full SaaS dashboard, AI chat, and embeddable widget. Click the bubble in the bottom-right corner.
section:
  title: Everything you need to [ship fast]{.text-primary}
  description: Stop rebuilding authentication, payments, and AI integrations from scratch.
  images:
    mobile: /images/homepage/demo2.png
    desktop: /images/homepage/demo2.png
  features:
    - title: AI-First Architecture
      description: Built-in AI chat with RAG using Cloudflare AutoRAG and Vercel AI SDK v6.
      class: border-l border-primary pl-4
    - title: Production-Ready Auth
      description: Google OAuth and credentials auth with email verification, password reset, and session management.
      class: border-l border-default pt-4 pl-4
    - title: Stripe or Polar Subscriptions
      description: Complete billing flow with webhooks, customer portal, and plan management.
      class: border-l border-default pt-4 pl-4
features:
  title: '[Full-Stack]{.text-primary} Features'
  description: Everything pre-configured so you can focus on your unique features.
  features:
    - title: AI Chat with RAG
      description: Cloudflare AutoRAG for knowledge base search, Vercel AI SDK v6 for streaming responses, and tool calling support.
      icon: i-lucide-message-circle
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Authentication
      description: Google OAuth, email/password login, email verification, password reset, and session management with nuxt-auth-utils.
      icon: i-lucide-lock
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Stripe or Polar Billing
      description: Subscription management, checkout sessions, customer portal, webhooks, and plan-based feature gating.
      icon: i-lucide-credit-card
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Embeddable Widget
      description: Iframe-based chat widget with customizable colors, position, and branding. One-line embed script.
      icon: i-lucide-code
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: NuxtHub + Cloudflare
      description: D1 database, R2 blob storage, KV store, and zero-config deployment to Cloudflare Workers.
      icon: i-lucide-cloud
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Nuxt UI v4 + Dark Mode
      description: Beautiful, accessible components with full dark mode support. Semantic color system and customizable theming.
      icon: i-lucide-palette
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
steps:
  title: From Clone to [Production]{.text-primary} in Minutes
  description: Skip months of boilerplate setup. Focus on what makes your product unique.
  items:
    - title: 1. Clone & Configure
      description: Clone the repo, set up environment variables, and run your first deployment.
      image: /images/homepage/knowledge.svg
    - title: 2. Customize
      description: Adjust branding, configure plans, and add your unique features on top.
      image: /images/homepage/customize.svg
    - title: 3. Ship
      description: Deploy to Cloudflare with one command. Your AI-powered SaaS is live.
      image: /images/homepage/live.svg
