      icon: i-lucide-send
    - title: Blog & Content
      description: Nuxt Content integration with markdown support, SEO optimization, and landing page YAML configuration.
      icon: i-lucide-file-text
    - title: Support Escalation
      description: Human handoff from AI chat, ticket management, email notifications, and threaded replies.
      icon: i-lucide-headphones
