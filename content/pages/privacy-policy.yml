seo:
  title: Privacy Policy | NuxtBeyond
  description: Learn how NuxtBeyond collects, uses, and protects your personal data when you purchase our Nuxt 4 boilerplate.
title: Privacy Policy
lastUpdated: January 24, 2025
sections:
  - title: Introduction
    content: |
      CraftCodely SRL ("we," "us," or "our") operates NuxtBeyond, an AI-first Nuxt 4 boilerplate for building SaaS products. This Privacy Policy explains how we collect, use, disclose, and safeguard your information when you purchase and use our boilerplate at nuxtbeyond.com.

      We are committed to protecting your privacy and complying with the General Data Protection Regulation (GDPR) and other applicable data protection laws. By purchasing NuxtBeyond, you agree to the collection and use of information in accordance with this policy.

  - title: Information We Collect
    subsections:
      - subtitle: Personal Information
        content: |
          When you purchase NuxtBeyond, we collect:

          - **Email address** - Used for license delivery, updates, and communication
          - **Name** - Used for personalization and identification
          - **Password** - Encrypted and stored securely for account access (if you create an account)
          - **Google OAuth data** - If you sign up via Google (name, email, profile picture)

      - subtitle: Payment Information
        content: |
          We use Stripe for payment processing. We store:

          - **Stripe customer ID** - Links your purchase to your Stripe account
          - **Purchase history** - Products purchased and transaction dates

          We do not store credit card numbers or payment details. All payment information is handled securely by Stripe in accordance with PCI-DSS standards.

      - subtitle: Technical Information
        content: |
          We automatically collect certain information when you visit our website:

          - **Usage data** - Pages viewed, time spent on site
          - **Device information** - Browser type, operating system, IP address
          - **Cookies** - Session cookies for authentication and functionality

  - title: How We Use Your Information
    content: |
      We use your information for the following purposes:

      - **License delivery** - To provide access to the NuxtBeyond boilerplate after purchase
      - **Updates and announcements** - To notify you of product updates and new features
      - **Account management** - To manage your account and purchase history
      - **Support** - To respond to your questions and provide assistance
      - **Improvement** - To analyze usage patterns and improve our website and products
      - **Legal compliance** - To comply with legal obligations

      We process your data based on the following legal grounds:

      - **Contract performance** - Processing necessary to deliver your purchased product
      - **Legitimate interests** - Improving our products and preventing fraud
      - **Consent** - When you provide explicit consent for specific processing
      - **Legal obligation** - Complying with laws and regulations

  - title: Data Sharing and Third Parties
    content: |
      We do not sell, trade, or rent your personal information to third parties. We share data only with trusted service providers:

      - **Cloudflare** - Website hosting and infrastructure
      - **Stripe** - Payment processing
      - **Google OAuth** - Authentication service (only if you choose to sign in with Google)
      - **Resend** - Transactional email delivery
      - **Discord** - Community platform (if you join our Discord community)

      All third-party providers are bound by data protection agreements and process data only as instructed.

  - title: Data Storage and Security
    content: |
      **Storage location:** Your data is stored on Cloudflare's infrastructure, which may include servers located in the European Union and other regions.

      **Security measures:** We implement industry-standard security practices:

      - Encrypted passwords using bcrypt hashing
      - HTTPS encryption for all data in transit
      - Secure authentication with session tokens
      - Access controls and monitoring

      While we strive to protect your information, no method of transmission over the internet is 100% secure. We cannot guarantee absolute security.

  - title: Data Retention
    content: |
      We retain your personal data for as long as necessary to provide you with product updates and support:

      - **Account data** - Retained until account deletion is requested
      - **Purchase records** - Retained for 7 years to comply with tax and accounting regulations
      - **Email communications** - Retained for support and update purposes

  - title: Your GDPR Rights
    content: |
      If you are located in the European Union, you have the following rights under GDPR:

      - **Right to access** - Request a copy of your personal data
      - **Right to rectification** - Correct inaccurate or incomplete data
      - **Right to erasure** - Request deletion of your personal data
      - **Right to restriction** - Request limitation of data processing
      - **Right to data portability** - Receive your data in a machine-readable format
      - **Right to object** - Object to certain types of data processing
      - **Right to withdraw consent** - Withdraw consent for data processing at any time

      To exercise any of these rights, contact us at support@nuxtbeyond.com. We will respond within 30 days.

  - title: Account Deletion
    content: |
      You can request account deletion at any time by emailing support@nuxtbeyond.com. Upon receiving your request, we will:

      1. Verify your identity to ensure security
      2. Delete your account and associated personal data

      Please note that purchase records will be retained for 7 years to comply with legal obligations. Your license to use the boilerplate remains valid after account deletion.

  - title: Cookies and Tracking
    content: |
      We use cookies to:

      - Maintain your logged-in session
      - Remember your preferences
      - Analyze site usage and performance

      You can control cookies through your browser settings. Disabling cookies may limit certain functionality of our website.

  - title: Children's Privacy
    content: |
      NuxtBeyond is intended for professional developers aged 18 and older. We do not knowingly collect personal information from children under 18. If we discover that a child has provided us with personal data, we will delete it immediately.

  - title: International Data Transfers
    content: |
      Your data may be transferred to and processed in countries outside the European Economic Area (EEA). When we transfer data internationally, we ensure appropriate safeguards are in place, such as:

      - Standard Contractual Clauses approved by the European Commission
      - Data processing agreements with third-party providers
      - Compliance with GDPR requirements for international transfers

  - title: Changes to This Policy
    content: |
      We may update this Privacy Policy from time to time. Changes will be posted on this page with an updated "Last Updated" date. Significant changes will be communicated via email. Continued use of our website after changes constitutes acceptance of the updated policy.

  - title: Contact Us
    content: |
      If you have questions about this Privacy Policy or our data practices, contact us at:

      **CraftCodely SRL**

      Email: support@nuxtbeyond.com

      Location: Romania

      For GDPR-related inquiries or to exercise your data rights, email support@nuxtbeyond.com with "GDPR Request" in the subject line.
