seo:
  title: Privacy Policy | NuxtBeyond
  description: How the nuxtbeyond.com website and live demo handle your data. NuxtBeyond is a free, open-source Nuxt 4 boilerplate under the MIT License.
title: Privacy Policy
lastUpdated: November 10, 2026
sections:
  - title: Introduction
    content: |
      Rareș Serban ("we," "us," or "our") runs nuxtbeyond.com, the public website and live demo for NuxtBeyond, an open-source, AI-first Nuxt 4 boilerplate released under the MIT License. This Privacy Policy explains what information we collect when you visit the website or use the demo, how we use it, and the rights you have.

      We aim to comply with the General Data Protection Regulation (GDPR) and other applicable data protection laws.

      This policy covers nuxtbeyond.com only. If you clone NuxtBeyond from [GitHub](https://github.com/BeyondFolder/nuxt-beyond) and run your own app, you are responsible for your app's privacy policy. We do not receive any data from apps you build with it.

  - title: Information We Collect
    subsections:
      - subtitle: No Personal Accounts
        content: |
          You do not need to create an account or pay anything to use the website or the demo. Sign-up and Google sign-in are turned off in the demo. Instead, you log in with shared demo accounts whose login details are shown on the site. We do not collect your name, email address, or payment details through sign-up.

      - subtitle: Content You Submit to the Demo
        content: |
          When you use the demo, we store what you create in it, such as:

          - **Chats** - Messages you send to the AI assistant and the replies
          - **Knowledge base** - Documents and text you upload to the demo project
          - **Generated media** - Images and videos you generate
          - **Project settings** - Changes you make to the demo project
          - **Support requests** - If you ask the chat widget to contact human support, the email address, optional name, and question you provide

          The demo accounts are shared, so other visitors may see this content. Please do not enter personal, confidential, or sensitive information. If you are only testing the support flow, use a placeholder email address.

      - subtitle: Technical Information
        content: |
          When you visit the website, we and our service providers process:

          - **IP address** - Used for rate limiting, abuse prevention, and the CAPTCHA check on the login page
          - **Usage data** - Pages viewed, referring site, and time on site, collected by our analytics provider
          - **Device information** - Browser type, operating system, and approximate location derived from your IP address

      - subtitle: If You Contact Us
        content: |
          If you email support@nuxtbeyond.com or message us on X, we receive your email address or username and the content of your message.

  - title: How We Use Your Information
    content: |
      We use your information to:

      - **Run the demo** - Store what you create and send your prompts to AI models to generate replies, images, and videos
      - **Keep the site secure** - Rate limit requests, run CAPTCHA checks, and prevent abuse
      - **Understand traffic** - See which pages are visited so we can improve the website
      - **Reply to you** - Answer questions you send us
      - **Legal compliance** - Meet our legal obligations

      We process your data based on the following legal grounds:

      - **Legitimate interests** - Running, securing, and improving the website and demo
      - **Consent** - Where the law requires it
      - **Legal obligation** - Complying with laws and regulations

  - title: Service Providers
    content: |
      We do not sell, trade, or rent your personal information. We share data only with the service providers that run the website and demo:

      - **Cloudflare** - Hosting (Workers), database (D1), file storage (R2), rate limiting storage (KV), CAPTCHA (Turnstile), and AI services (AI Gateway, AI Search, and Workers AI, which runs the dashboard chat and the free SaaS Ideas Generator)
      - **OpenAI** - Generates chat widget replies, images, and videos in the demo. Your prompts, and knowledge base content relevant to them, are sent to OpenAI through Cloudflare AI Gateway
      - **Datafa.st** - Website analytics

      The website footer also shows badge images loaded from directory sites that list NuxtBeyond. As with any image on the web, those sites receive your IP address and browser details when the image loads.

      The website links to GitHub, X, LinkedIn, and other sites. Those sites have their own privacy policies.

  - title: Data Storage and Security
    content: |
      **Storage location:** Data is stored on Cloudflare's infrastructure, which may include servers in the European Union and other regions.

      **Security measures:** We use standard security practices, including:

      - HTTPS encryption for all data in transit
      - Encrypted session cookies
      - Hashed passwords (scrypt) for the demo accounts
      - Rate limiting and CAPTCHA on login

      No method of transmission over the internet is 100% secure, and we cannot guarantee absolute security.

  - title: Data Retention
    content: |
      - **Demo content** - Kept until the demo is reset or the content is deleted. The demo may be reset at any time, and demo data may be deleted without notice.
      - **Rate limiting data** - Kept for the length of the rate limit window, then deleted automatically
      - **Emails and messages** - Kept as long as needed to answer you and follow up

  - title: Your GDPR Rights
    content: |
      If you are located in the European Union, you have the following rights under GDPR:

      - **Right to access** - Request a copy of your personal data
      - **Right to rectification** - Correct inaccurate or incomplete data
      - **Right to erasure** - Request deletion of your personal data
      - **Right to restriction** - Request limitation of data processing
      - **Right to data portability** - Receive your data in a machine-readable format
      - **Right to object** - Object to certain types of data processing
      - **Right to withdraw consent** - Withdraw consent for data processing at any time

      To exercise any of these rights, contact us at support@nuxtbeyond.com. We will respond within 30 days. You also have the right to lodge a complaint with your local data protection authority.

  - title: Cookies and Local Storage
    content: |
      We use:

      - **Session cookie** - Keeps you logged in to the demo (encrypted, expires after 30 days)
      - **Local storage** - Remembers preferences such as light or dark mode
      - **Analytics** - Our analytics provider may store an identifier in your browser to count visits

      You can control cookies through your browser settings. Disabling cookies will log you out of the demo and may limit other functionality.

  - title: Children's Privacy
    content: |
      NuxtBeyond is intended for developers aged 18 and older. We do not knowingly collect personal information from children under 18. If we discover that a child has provided us with personal data, we will delete it.

  - title: International Data Transfers
    content: |
      Your data may be transferred to and processed in countries outside the European Economic Area (EEA), for example by our service providers. When that happens, we rely on appropriate safeguards such as the Standard Contractual Clauses approved by the European Commission.

  - title: Changes to This Policy
    content: |
      We may update this Privacy Policy from time to time. Changes will be posted on this page with an updated "Last Updated" date. Continued use of the website after changes means you accept the updated policy.

  - title: Contact Us
    content: |
      If you have questions about this Privacy Policy or how your data is handled, contact:

      **Rareș Serban**

      Email: support@nuxtbeyond.com

      X: [@raress96](https://x.com/raress96)

      Location: Romania

      For GDPR requests, email support@nuxtbeyond.com with "GDPR Request" in the subject line.
