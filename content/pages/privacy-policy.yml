seo:
  title: 'Privacy Policy | [Your App]'
  description: 'How [Your App] collects, uses, and protects personal data. Starter template: replace the placeholders before publishing.'
title: Privacy Policy
lastUpdated: '[Month Day, Year]'
sections:
  - title: About This Template
    content: |
      This page is a starter template included with the NuxtBeyond open-source boilerplate. It describes the data the boilerplate collects out of the box, but it is not legal advice.

      Before publishing, replace every placeholder in square brackets (such as [Your Company], [Your App] and [yourdomain.com]), update the lists below to match the features and providers you actually use, and have the result reviewed by a qualified lawyer in your jurisdiction. Then delete this section.

  - title: Introduction
    content: |
      [Your Company] ("we", "us" or "our") operates [Your App] at [yourdomain.com] (the "Service"). This Privacy Policy explains what information we collect, how we use and share it, and the choices you have.

      We aim to comply with the data protection laws that apply to us, including the General Data Protection Regulation (GDPR) where applicable.

  - title: Information We Collect
    subsections:
      - subtitle: Account Information
        content: |
          - **Email address and name** - Used to create and secure your account and to contact you
          - **Password** - Stored only as a salted hash, never in plain text
          - **Google sign-in data** - If you sign in with Google, we receive your name, email, and profile picture

      - subtitle: Project and Chat Data
        content: |
          - **Project settings** - Name, description, appearance settings, and allowed domains for your widget
          - **Knowledge base content** - Documents and text you upload
          - **Chat conversations** - Messages exchanged between your visitors and the AI assistant
          - **Support escalations** - Questions escalated to a human and the replies to them, including the name and email a visitor provides
          - **Team invitations** - Email addresses of people you invite to a project

      - subtitle: Payment Information
        content: |
          Payments are handled by [Stripe / Polar]. We store only the customer and subscription identifiers and your subscription status. We do not store card numbers or full payment details.

      - subtitle: Technical Information
        content: |
          - **IP address and browser information** - Used for security, abuse prevention, and rate limiting
          - **Cookies** - A session cookie keeps you signed in (see Cookies below)
          - **Analytics** - [Describe any analytics tools you add, or remove this line.]

  - title: How We Use Your Information
    content: |
      We use your information to:

      - Provide, maintain, and secure the Service
      - Generate AI responses from your knowledge base content
      - Manage your account, projects, team members, and subscription
      - Send service emails such as verification, password reset, invitations, and support notifications
      - Comply with legal obligations and enforce our Terms of Service

      Where GDPR applies, we rely on these legal bases: performance of a contract, our legitimate interests (such as keeping the Service secure), your consent where we ask for it, and compliance with legal obligations.

  - title: Service Providers
    content: |
      We do not sell your personal information. We share data only with providers that help us run the Service. Remove any you do not use:

      - **Cloudflare** - Hosting, database (D1), file storage (R2), key-value storage (KV), AI Gateway, AI Search, and Turnstile bot protection
      - **[AI provider, e.g. OpenAI]** - Generates AI responses from chat messages and relevant knowledge base content
      - **[Stripe / Polar]** - Payment processing and subscription management
      - **Google** - Sign-in, only if you choose to sign in with Google
      - **Resend** - Transactional email delivery

  - title: Data Security
    content: |
      We use reasonable measures to protect your data, including hashed passwords, HTTPS for data in transit, secure session cookies, and role-based access to projects. No method of transmission or storage is completely secure, so we cannot guarantee absolute security.

  - title: Data Retention
    content: |
      We keep personal data for as long as your account is active or as needed to provide the Service. [Adjust these periods to your practices:]

      - **Account and project data** - Until you delete it or ask us to delete your account
      - **Payment records** - As long as required by tax and accounting law [e.g. X years]
      - **Backups** - Up to [X] days after deletion

  - title: Your Rights
    content: |
      Depending on where you live, you may have the right to access, correct, delete, restrict, or export your personal data, to object to certain processing, and to withdraw consent at any time.

      To exercise these rights, email [privacy@yourdomain.com]. We will respond within [30] days.

  - title: Account Deletion
    content: |
      You can request deletion of your account at any time by emailing [support@yourdomain.com]. After verifying your identity, we will delete your account, projects, knowledge base content, and chat conversations, and cancel any active subscription. Some data may remain in backups or be kept where the law requires it, as described in Data Retention.

  - title: Cookies
    content: |
      We use a session cookie to keep you signed in. [List any other cookies you add, such as analytics or preferences.] You can control cookies in your browser settings, but disabling them may prevent you from signing in.

  - title: Children's Privacy
    content: |
      The Service is not intended for anyone under [18]. We do not knowingly collect personal data from children. If we learn that a child has provided personal data, we will delete it.

  - title: International Data Transfers
    content: |
      Your data may be processed in countries other than your own, including by the providers listed above. Where required, we use appropriate safeguards such as data processing agreements and Standard Contractual Clauses.

  - title: Changes to This Policy
    content: |
      We may update this Privacy Policy from time to time. We will post changes on this page with a new "Last updated" date and notify you of significant changes by email.

  - title: Contact Us
    content: |
      Questions about this Privacy Policy or your data? Contact us:

      **[Your Company]**

      Email: [privacy@yourdomain.com]

      Address: [Your Company Address]
