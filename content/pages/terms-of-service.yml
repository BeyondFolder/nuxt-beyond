  - title: Suspension
    content: |
      We may block or limit access to the website or demo for anyone who breaks these Terms or puts the service at risk. This does not affect your rights under the MIT License for any copy of the source code you already have.

  - title: Dispute Resolution and Governing Law
    content: |
      - **Governing law** - These Terms are governed by the laws of Romania, without regard to conflict of law principles
      - **Jurisdiction** - Any disputes shall be resolved in the courts of Romania
      - **Good faith negotiation** - Before filing a lawsuit, you agree to attempt to resolve disputes through good-faith negotiation

  - title: Changes to Terms
    content: |
      We may update these Terms from time to time. Changes will be posted on this page with an updated "Last Updated" date. Continued use of the website or demo after changes take effect means you accept the updated Terms.

  - title: General Provisions
