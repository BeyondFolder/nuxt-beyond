seo:
  title: 'Terms of Service | [Your App]'
  description: 'Terms and conditions for using [Your App]. Starter template: replace the placeholders before publishing.'
title: Terms of Service
lastUpdated: '[Month Day, Year]'
sections:
  - title: About This Template
    content: |
      This page is a starter template included with the NuxtBeyond open-source boilerplate. It is not legal advice and is not a contract between you and the boilerplate's authors.

      Before publishing, replace every placeholder in square brackets (such as [Your Company], [Your App] and [yourdomain.com]), adapt each section to how your product actually works, remove anything that does not apply, and have the result reviewed by a qualified lawyer in your jurisdiction. Then delete this section.

  - title: Agreement to Terms
    content: |
      These Terms of Service ("Terms") are an agreement between you ("you" or "your") and [Your Company] ("[Your App]", "we", "us" or "our") governing your use of [Your App] at [yourdomain.com] (the "Service").

      By creating an account or using the Service, you agree to these Terms and our Privacy Policy. If you do not agree, do not use the Service.

  - title: Eligibility and Accounts
    content: |
      You must be at least [18] years old and able to enter into a binding contract to use the Service. When you create an account, you agree to:

      - Provide accurate and complete information and keep it up to date
      - Keep your password secure and confidential
      - Notify us promptly of any unauthorized access to your account
      - Take responsibility for all activity under your account

      We may suspend or terminate accounts that violate these Terms or provide false information.

  - title: The Service
    content: |
      [Your App] is a software-as-a-service product that [describe what your product does]. Depending on your plan, the Service may include:

      - AI chat assistants and an embeddable chat widget for your website
      - Knowledge base management (document uploads and text content)
      - Chat conversation history
      - Human support escalation
      - Team workspaces with invited members

      We may modify, suspend, or discontinue parts of the Service with reasonable notice.

  - title: Subscriptions and Billing
    subsections:
      - subtitle: Plans and Pricing
        content: |
          Current plans, limits, and prices are listed on our pricing page at [yourdomain.com/#pricing]. We will give existing subscribers at least [30] days notice before changing the price of their plan.

      - subtitle: Payments
        content: |
          - **Payment processing** - Payments are processed by our payment provider, [Stripe / Polar]. We do not store your full card details.
          - **Billing cycle** - Paid plans are billed monthly per project and renew automatically until cancelled.
          - **Free trial** - [Describe any free trial, for example: first-time subscribers to the Pro plan get a 7-day free trial.]
          - **Failed payments** - If a payment fails, paid features may be suspended until the payment is resolved.

      - subtitle: Cancellation and Refunds
        content: |
          - **Cancellation** - You can cancel at any time from the billing page, which opens the payment provider's customer portal.
          - **Effect of cancellation** - Cancellation takes effect at the end of the current billing period. You keep access to paid features until then, after which the project moves to the Free plan.
          - **Refunds** - [State your refund policy.]

  - title: Acceptable Use
    content: |
      Your use of the Service is subject to the limits of your plan. You agree not to:

      - Exceed or try to bypass your plan's usage limits
      - Use the Service for illegal, harmful, or fraudulent purposes
      - Upload content that infringes the intellectual property or privacy rights of others
      - Distribute malware, spam, or malicious code through the Service
      - Attempt to reverse engineer, disrupt, or compromise the Service
      - Scrape or data-mine the Service without permission
      - Harass, abuse, or impersonate any person or entity

      We may suspend or terminate accounts that violate these rules.

  - title: Your Content
    content: |
      You keep ownership of the content you upload or create in the Service, including knowledge base documents, widget settings, and chat conversations.

      You grant us a limited, non-exclusive license to store, process, and display that content only as needed to provide and back up the Service. This license ends when you delete the content or your account, subject to the backup retention periods in our Privacy Policy.

  - title: Our Intellectual Property
    content: |
      The Service, including its software, design, and branding, is owned by [Your Company] or its licensors. These Terms do not grant you any right to use our trademarks, logos, or branding without permission.

  - title: AI-Generated Content
    content: |
      The Service uses third-party AI providers ([list your providers, for example OpenAI via Cloudflare AI Gateway, and Google Gemini for video]) to generate responses. You acknowledge that:

      - AI responses can be inaccurate or incomplete, and we do not guarantee their correctness
      - You are responsible for reviewing AI output before relying on it
      - You are responsible for making sure your assistant's responses comply with the laws that apply to you

  - title: Privacy
    content: |
      Our Privacy Policy explains how we collect and use personal data and forms part of these Terms. You can request deletion of your account at any time by emailing [support@yourdomain.com].

  - title: Availability and Support
    content: |
      We aim to keep the Service available but do not guarantee uninterrupted or error-free operation. We may perform maintenance, with advance notice when possible. Support is available at [support@yourdomain.com].

  - title: Disclaimer and Limitation of Liability
    content: |
      TO THE MAXIMUM EXTENT PERMITTED BY LAW:

      - The Service is provided "as is" and "as available", without warranties of any kind, express or implied
      - Our total liability for any claim relating to the Service is limited to the amount you paid us in the [12] months before the claim
      - We are not liable for indirect, incidental, consequential, or punitive damages, including lost profits, data loss, or business interruption

  - title: Indemnification
    content: |
      You agree to indemnify and hold harmless [Your Company] and its officers, employees, and agents from claims, losses, and expenses (including reasonable legal fees) arising from your use of the Service, your content, your violation of these Terms, or your violation of any third-party rights.

  - title: Termination
    content: |
      You may stop using the Service and request account deletion at any time. We may suspend or terminate your access if you violate these Terms, act fraudulently, or create a security risk. When your account ends, your widgets stop working and your data is deleted as described in our Privacy Policy. Sections that by their nature should survive termination (including intellectual property, liability, and indemnification) will survive.

  - title: Governing Law
    content: |
      These Terms are governed by the laws of [Your Jurisdiction]. Disputes will be resolved in the courts of [Your Jurisdiction], and both parties agree to first try to resolve any dispute through good-faith negotiation.

  - title: Changes to These Terms
    content: |
      We may update these Terms from time to time. We will post changes on this page with a new "Last updated" date and notify you of material changes by email at least [30] days in advance. Continuing to use the Service after changes take effect means you accept the updated Terms.

  - title: Contact Us
    content: |
      Questions about these Terms? Contact us:

      **[Your Company]**

      Email: [support@yourdomain.com]

      Address: [Your Company Address]

      Website: [yourdomain.com]
