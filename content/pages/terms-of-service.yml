      - **Third-party services** - We are not liable for issues caused by third-party services (hosting providers, AI services, payment processors, and similar)
      - **Your responsibility** - You are solely responsible for the applications you build and deploy with the boilerplate

      Nothing in these Terms limits liability that cannot be limited under applicable law.

  - title: Indemnification
