seo:
  title: Terms of Service | NuxtBeyond
  description: Terms for using the nuxtbeyond.com website and live demo. The NuxtBeyond source code is free and open source under the MIT License.
title: Terms of Service
lastUpdated: November 10, 2026
sections:
  - title: Agreement to Terms
    content: |
      These Terms of Service ("Terms") govern your use of the nuxtbeyond.com website and the live demo hosted on it. The website and demo are run by Rareș Serban ("NuxtBeyond," "we," "us," or "our").

      By using the website or the demo, you agree to these Terms and to our [Privacy Policy](/privacy-policy). If you do not agree, please do not use them.

  - title: What NuxtBeyond Is
    content: |
      NuxtBeyond is an open-source, AI-first Nuxt 4 boilerplate for building SaaS products. It has three parts:

      - **Source code** - The boilerplate itself, published on [GitHub](https://github.com/BeyondFolder/nuxt-beyond) under the MIT License
      - **Website** - The public site at nuxtbeyond.com, including the blog and free tools
      - **Live demo** - A hosted copy of the app that you can try with shared demo accounts

      NuxtBeyond is free. Nothing is sold on this website.

  - title: Open-Source License
    content: |
      The NuxtBeyond source code is licensed under the [MIT License](https://opensource.org/license/mit). The LICENSE file in the GitHub repository is the license that applies to the code, and these Terms do not limit any rights it gives you.

      In short, the MIT License lets you use, copy, modify, merge, publish, distribute, sublicense, and sell copies of the code, including in commercial projects, as long as you keep the copyright notice and license text. The code is provided "as is", without warranty.

      NuxtBeyond also depends on third-party open-source packages (such as Nuxt, Vue, and Tailwind CSS) that come with their own licenses. You are responsible for complying with them.

  - title: Your Projects
    content: |
      You own the applications, products, and services you build with NuxtBeyond. We make no claim to your code, designs, data, or business.

  - title: The Live Demo
    content: |
      The live demo lets you try NuxtBeyond before you clone it. When you use it:

      - **Shared accounts** - The demo uses shared login details that anyone can use. Other visitors may see the chats, documents, images, videos, and support requests you create.
      - **No personal or confidential data** - Do not upload or type anything personal, confidential, or sensitive into the demo.
      - **Usage limits** - Chats, chat widget conversations, image generation, and video generation have daily limits to keep costs under control.
      - **No guarantees** - The demo may be reset, changed, limited, or taken offline at any time, and demo data may be deleted without notice.
      - **Evaluation only** - Do not rely on the demo to store data or serve real users.

  - title: Acceptable Use
    content: |
      When using the website or demo, you agree not to:

      - Break the law or infringe anyone's rights
      - Upload malware, or content that is illegal, harmful, hateful, or sexually explicit
      - Try to get around rate limits, demo limits, CAPTCHA, or other security measures
      - Attack or overload the website, scrape it at scale, or try to gain unauthorized access to it or its infrastructure
      - Use the AI features to generate content that breaks the usage policies of the AI providers behind the demo

  - title: AI-Generated Content
    content: |
      The demo uses AI models to answer questions and to generate text, images, and videos. AI output can be wrong, incomplete, or unexpected. Do not rely on it for legal, medical, financial, or other important decisions.

  - title: Third-Party Services and Links
    content: |
      The website links to third-party sites such as GitHub, X, and LinkedIn, and the demo runs on third-party services such as Cloudflare and OpenAI. Those services have their own terms and privacy policies, and we are not responsible for them.

      If you build your own app with NuxtBeyond, the services you connect (for example Cloudflare, OpenAI, Stripe or Polar, and Resend) run on your own accounts, under your own agreements with those providers.

  - title: Disclaimer of Warranties
    content: |
      THE WEBSITE, THE LIVE DEMO, AND THE NUXTBEYOND SOURCE CODE ARE PROVIDED "AS IS" AND "AS AVAILABLE", WITHOUT WARRANTIES OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, AND NON-INFRINGEMENT.

      We do not promise that the website or demo will be available, secure, or error-free, or that the boilerplate will meet your specific requirements.

  - title: Limitation of Liability
    content: |
      To the maximum extent permitted by law:

