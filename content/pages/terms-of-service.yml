    content: |
      These Terms of Service ("Terms") constitute a legally binding agreement between you ("User," "you," or "your") and CraftCodely SRL ("NuxtBeyond," "we," "us," or "our") governing your purchase and use of the NuxtBeyond boilerplate at nuxtbeyond.com.

      By purchasing NuxtBeyond, you agree to be bound by these Terms and our Privacy Policy. If you do not agree, you may not purchase or use NuxtBeyond.

  - title: Eligibility
    content: |
      You must be at least 18 years old to purchase NuxtBeyond. By making a purchase, you represent and warrant that:

      - You are at least 18 years of age
      - You have the legal capacity to enter into binding contracts
      - You will provide accurate, current, and complete information during purchase
      - You have the authority to use the payment method provided

  - title: Product Description
    content: |
      NuxtBeyond is a software boilerplate (starter template) for building AI-powered SaaS applications. Your purchase includes:

      - **Source code** - Complete access to the NuxtBeyond codebase
      - **Documentation** - Setup guides and CLAUDE.md for AI-assisted development
      - **Lifetime updates** - Access to all future updates and improvements
      - **Discord community** - Access to our developer community for support and discussions

      The boilerplate is designed to help developers build their own products faster. It is not a hosted service or SaaS platform.

  - title: Pricing and Payment
    subsections:
      - subtitle: Available Products
        content: |
          NuxtBeyond is available in the following packages:

          - **NuxtBeyond Boilerplate** - Complete Nuxt 4 boilerplate for AI-powered SaaS
          - **Boilerplate + Distribution Framework** - Everything in the boilerplate plus Claude Code Distribution Framework (coming soon)

          Pricing is displayed on our website and may change at any time. Price changes do not affect existing purchases.

      - subtitle: One-Time Purchase
        content: |
          - **Payment processing** - All payments are processed securely through Stripe
          - **One-time payment** - NuxtBeyond is a one-time purchase, not a subscription
          - **Instant access** - You receive access to the boilerplate immediately after purchase
          - **No recurring charges** - You will not be charged again for updates or continued access

      - subtitle: Refunds
        content: |
          Due to the digital nature of the product and immediate access to source code:

          - **No refunds** - All sales are final. We do not offer refunds after purchase.
          - **Pre-purchase review** - We encourage you to review the product features, demo, and documentation before purchasing.
          - **Technical issues** - If you experience technical issues accessing your purchase, contact support@nuxtbeyond.com for assistance.

