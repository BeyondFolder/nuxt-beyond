seo:
  title: 'About NuxtBeyond: the AI-first Nuxt 4 boilerplate'
  description: NuxtBeyond is an AI-first Nuxt 4 boilerplate for SaaS products, with auth, Stripe or Polar billing, AI chat with RAG and Cloudflare deploys. Built by Rareș Serban.
title: About NuxtBeyond
description: NuxtBeyond is an AI-first Nuxt 4 boilerplate for building SaaS products. You buy the source code once and start your product with login, billing, AI chat and deployment already working.
sections:
  - title: What's in it
    paragraphs:
      - "A full Nuxt 4 app in TypeScript that you clone and change. It has:"
    items:
      - Login with email and password or Google, with email verification and password reset (nuxt-auth-utils)
      - Subscriptions with Stripe or Polar, picked with one environment variable, with webhooks and the customer portal
      - AI chat with RAG over your own documents, using Vercel AI SDK v6 and Cloudflare AI Search (formerly AutoRAG)
      - An embeddable chat widget for other sites, with a check on which domains can load it
      - Multi-tenant projects with admin and member roles and email invites
      - Deployment to Cloudflare Workers with D1, R2 and KV
  - title: Who it's for
    paragraphs:
      - Developers who know Vue or Nuxt and TypeScript and want to ship an AI SaaS without spending the first weeks on auth, payments and infrastructure. Mostly solo founders, indie hackers and small agencies that build SaaS for clients.
      - It's not a good fit if your team only writes React, or if you can't deploy and change a Nuxt app yourself. It also doesn't have 2FA, passkeys or i18n yet.
  - title: Who builds it
    paragraphs:
      - I'm Rareș Serban, a software engineer and solo founder in Cluj-Napoca, Romania. I build and maintain NuxtBeyond on my own.
      - I built AI SaaS products with Nuxt for 6 months and kept copying the same auth, Stripe and AI setup between repos. So I pulled it out into one boilerplate. I start every new project from it, and the updates go to the GitHub repository buyers get access to.
