  title: 'Nuxt Session Password & NUXT_APP_SECRET Generator'
  description: 'Generate a secure NUXT_SESSION_PASSWORD for nuxt-auth-utils or a NUXT_APP_SECRET for Nuxt 4.6+. Runs in your browser, nothing is sent anywhere.'
title: 'Nuxt Session Password & App Secret Generator'
description: 'Generate a NUXT_SESSION_PASSWORD for nuxt-auth-utils or a NUXT_APP_SECRET for Nuxt 4.6+, right in your browser.'
faqs:
  - label: What is NUXT_SESSION_PASSWORD?
    content: It's the secret nuxt-auth-utils uses to encrypt and sign its session cookie, read into runtimeConfig.session.password. The nuxt-auth-utils README asks for at least 32 characters, and the session password this tool generates is 64.
  - label: What is NUXT_APP_SECRET in Nuxt 4.6?
    content: It sets runtimeConfig.appSecret, the root secret Nuxt 4.6 added so modules and server features can derive their own secrets from it with deriveSecret(purpose). Nuxt generates one in development if it's missing, but builds never do, so set it in every environment you deploy to if anything in your app uses it.
  - label: Do I need both?
    content: On nuxt-auth-utils v0.5.x (latest is v0.5.31) you need NUXT_SESSION_PASSWORD, and on Nuxt 4.6+ you should also set NUXT_APP_SECRET in production for anything that derives its secret from appSecret. An open pull request (#546) proposes moving nuxt-auth-utils to appSecret in v0.6, which would make NUXT_SESSION_PASSWORD ignored (checked October 10, 2026).
